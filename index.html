<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Laravel - Matrix Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Fira+Code:wght@300;400;600&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            overflow-x: hidden;
            font-family: 'Fira Code', monospace;
        }
        
        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.8;
        }
        
        .main-container {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .glitch {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 3.5rem;
            text-transform: uppercase;
            position: relative;
            text-shadow: 
                0.05em 0 0 rgba(255, 0, 0, 0.75),
                -0.025em -0.05em 0 rgba(0, 255, 0, 0.75),
                0.025em 0.05em 0 rgba(0, 0, 255, 0.75);
            animation: glitch 500ms infinite;
        }
        
        .glitch::before,
        .glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        .glitch::before {
            animation: glitch-1 0.5s infinite;
            color: #00ffff;
            z-index: -1;
        }
        
        .glitch::after {
            animation: glitch-2 0.5s infinite;
            color: #ff00ff;
            z-index: -2;
        }
        
        @keyframes glitch {
            0%, 100% {
                text-shadow: 
                    0.05em 0 0 rgba(255, 0, 0, 0.75),
                    -0.05em -0.025em 0 rgba(0, 255, 0, 0.75),
                    0.025em 0.05em 0 rgba(0, 0, 255, 0.75);
            }
            14% {
                text-shadow: 
                    0.05em 0 0 rgba(255, 0, 0, 0.75),
                    -0.05em -0.025em 0 rgba(0, 255, 0, 0.75),
                    0.025em 0.05em 0 rgba(0, 0, 255, 0.75);
            }
            15% {
                text-shadow: 
                    -0.05em -0.025em 0 rgba(255, 0, 0, 0.75),
                    0.025em 0.025em 0 rgba(0, 255, 0, 0.75),
                    -0.05em -0.05em 0 rgba(0, 0, 255, 0.75);
            }
            49% {
                text-shadow: 
                    -0.05em -0.025em 0 rgba(255, 0, 0, 0.75),
                    0.025em 0.025em 0 rgba(0, 255, 0, 0.75),
                    -0.05em -0.05em 0 rgba(0, 0, 255, 0.75);
            }
            50% {
                text-shadow: 
                    0.025em 0.05em 0 rgba(255, 0, 0, 0.75),
                    0.05em 0 0 rgba(0, 255, 0, 0.75),
                    0 -0.05em 0 rgba(0, 0, 255, 0.75);
            }
            99% {
                text-shadow: 
                    0.025em 0.05em 0 rgba(255, 0, 0, 0.75),
                    0.05em 0 0 rgba(0, 255, 0, 0.75),
                    0 -0.05em 0 rgba(0, 0, 255, 0.75);
            }
        }
        
        @keyframes glitch-1 {
            0%, 100% {
                clip: rect(132px, 350px, 101px, 30px);
            }
            20% {
                clip: rect(33px, 350px, 84px, 30px);
            }
            40% {
                clip: rect(55px, 350px, 23px, 30px);
            }
            60% {
                clip: rect(12px, 350px, 67px, 30px);
            }
            80% {
                clip: rect(88px, 350px, 45px, 30px);
            }
        }
        
        @keyframes glitch-2 {
            0%, 100% {
                clip: rect(65px, 350px, 119px, 30px);
            }
            20% {
                clip: rect(92px, 350px, 31px, 30px);
            }
            40% {
                clip: rect(45px, 350px, 88px, 30px);
            }
            60% {
                clip: rect(23px, 350px, 56px, 30px);
            }
            80% {
                clip: rect(77px, 350px, 102px, 30px);
            }
        }
        
        .typing-cursor::after {
            content: '|';
            animation: blink 1s infinite;
            color: #00ff00;
        }
        
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
        
        .profile-card {
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #00ff00;
            border-radius: 15px;
            box-shadow: 
                0 0 20px rgba(0, 255, 0, 0.5),
                inset 0 0 20px rgba(0, 255, 0, 0.1);
            backdrop-filter: blur(10px);
            max-width: 900px;
            width: 100%;
            padding: 30px;
            position: relative;
            overflow: hidden;
        }
        
        .profile-card::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, #00ff00, #00ffff, #ff00ff, #00ff00);
            border-radius: 15px;
            opacity: 0.5;
            z-index: -1;
            animation: border-rotate 3s linear infinite;
        }
        
        @keyframes border-rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .skill-badge {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.875rem;
            display: inline-block;
            margin: 5px;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        
        .skill-badge:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }
        
        .experience-item {
            border-left: 3px solid #00ff00;
            padding-left: 20px;
            margin: 20px 0;
            position: relative;
        }
        
        .experience-item::before {
            content: '';
            position: absolute;
            left: -8px;
            top: 5px;
            width: 13px;
            height: 13px;
            background: #00ff00;
            border-radius: 50%;
            box-shadow: 0 0 10px #00ff00;
        }
        
        .text-green {
            color: #00ff00;
        }
        
        .text-cyan {
            color: #00ffff;
        }
        
        .terminal-header {
            background: #1a1a1a;
            padding: 10px;
            border-radius: 10px 10px 0 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .terminal-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        
        .terminal-dot.red { background: #ff5f56; }
        .terminal-dot.yellow { background: #ffbd2e; }
        .terminal-dot.green { background: #27c93f; }
        
        .terminal-body {
            background: #0a0a0a;
            padding: 20px;
            border-radius: 0 0 10px 10px;
            font-family: 'Fira Code', monospace;
            min-height: 200px;
        }
        
        .profile-img {
            border: 3px solid #00ff00;
            border-radius: 50%;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.5);
            transition: all 0.3s;
        }
        
        .profile-img:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(0, 255, 0, 0.8);
        }
        
        .pulse {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        .cert-badge {
            background: linear-gradient(135deg, #0a4d68 0%, #05bfdb 100%);
            color: white;
            padding: 3px 10px;
            border-radius: 15px;
            font-size: 0.75rem;
            display: inline-block;
            margin: 3px;
            transition: all 0.3s;
            box-shadow: 0 4px 10px rgba(5, 191, 219, 0.3);
        }
        
        .cert-badge:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(5, 191, 219, 0.5);
        }
        
        .achievement-link {
            color: #00ffff;
            text-decoration: none;
            display: inline-block;
            margin: 5px 10px 5px 0;
            transition: all 0.3s;
        }
        
        .achievement-link:hover {
            color: #ff00ff;
            text-shadow: 0 0 5px #ff00ff;
        }
    </style>
</head>
<body>
    <canvas id="matrix-canvas"></canvas>
    
    <div class="main-container">
        <div class="profile-card">
            <!-- Terminal Header -->
            <div class="terminal-header">
                <div class="terminal-dot red"></div>
                <div class="terminal-dot yellow"></div>
                <div class="terminal-dot green"></div>
                <span class="text-green text-sm ml-2">root@matrix:~$ security_profile.sh</span>
            </div>
            
            <!-- Profile Content -->
            <div class="terminal-body">
                <div class="text-center mb-8">
                    <h1 class="glitch text-green mb-4" data-text="Project Laravel">Project Laravel</h1>
                    <img src="https://media.licdn.com/dms/image/v2/D5603AQHzHIExV_o6sA/profile-displayphoto-shrink_200_200/B56ZaQj9xZHsAg-/0/1746182071540?e=1763596800&v=beta&t=v5y0uLm8XP0WxFaLGl1bmkQ-5TL8mKg32Np9_eUdYtw" 
                         alt="Profile" 
                         class="profile-img w-32 h-32 mx-auto mb-4">
                </div>
                
                <div id="typing-content" class="text-green typing-cursor"></div>
                
                <div class="mt-8">
                    <h3 class="text-cyan text-xl mb-4 font-bold">
                        <i class="fas fa-shield-alt mr-2"></i>Security Skills
                    </h3>
                    <div id="skills-container" class="flex flex-wrap"></div>
                </div>
                
                <div class="mt-8">
                    <h3 class="text-cyan text-xl mb-4 font-bold">
                        <i class="fas fa-briefcase mr-2"></i>Experience
                    </h3>
                    <div id="experience-container"></div>
                </div>
                
                <div class="mt-8">
                    <h3 class="text-cyan text-xl mb-4 font-bold">
                        <i class="fas fa-certificate mr-2"></i>Certifications
                    </h3>
                    <div id="certifications-container" class="flex flex-wrap"></div>
                </div>
                
                <div class="mt-8">
                    <h3 class="text-cyan text-xl mb-4 font-bold">
                        <i class="fas fa-trophy mr-2"></i>Achievements
                    </h3>
                    <div id="achievements-container"></div>
                </div>
                
                <div class="mt-8">
                    <h3 class="text-cyan text-xl mb-4 font-bold">
                        <i class="fas fa-graduation-cap mr-2"></i>Education
                    </h3>
                    <div id="education-container"></div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // Matrix Rain Effect
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        const matrix = "ABCDEFGHIJKLMNOPQRSTUVWXYZ123456789@#$%^&*()*&^%+-/~{[|`]}";
        const matrixArray = matrix.split("");
        
        const fontSize = 10;
        const columns = canvas.width / fontSize;
        
        const drops = [];
        for(let x = 0; x < columns; x++) {
            drops[x] = 1;
        }
        
        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.04)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#0F0';
            ctx.font = fontSize + 'px monospace';
            
            for(let i = 0; i < drops.length; i++) {
                const text = matrixArray[Math.floor(Math.random() * matrixArray.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                
                if(drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }
        
        setInterval(drawMatrix, 35);
        
        // Typing Animation
        const profileData = {
            name: "Guntur Parulian P",
            title: "IT Security - Blueteam",
            location: "Jakarta, Indonesia",
            contact: "+6285718123876 | gunturparulianp@gmail.com",
            linkedin: "https://www.linkedin.com/in/gunturp",
            summary: "Working in the field of Cyber Security (Blueteam). I love learning and looking for my next challenge. The more I learn, the more Network Security/Cyber Security becomes my passion, because my ambition has always been to help people and try to make the world a better place.",
            skills: [
                "Teamwork and Leadership", 
                "Troubleshooting", 
                "Security Analyst", 
                "Vulnerability Assessment", 
                "Hardening", 
                "Incident Handling and Response", 
                "Digital Forensic", 
                "Security Operation", 
                "Cloud", 
                "SIEM"
            ],
            experiences: [
                {
                    company: "PT MNC OTT Network (Vision+ / MNC Group)",
                    position: "Senior IT Security",
                    period: "Feb 2023 - present",
                    responsibilities: [
                        "Conduct regular security assessments to identify vulnerabilities and weaknesses in VOD and TV Channel systems",
                        "Implement and manage security monitoring tools to detect and respond to security incidents in real-time",
                        "Ensure compliance with industry-specific regulations related to media content and user data",
                        "Develop and maintain an incident response plan",
                        "Design and maintain secure network architectures for content delivery",
                        "Ensure and implement all appropriate security standards in AWS",
                        "Conduct security awareness training for employees",
                        "Coordinate security audits and assessments",
                        "Installing and tuning Wazuh to monitor devices and infrastructure on prem and cloud (AWS)"
                    ]
                },
                {
                    company: "PT Proteksi Siber Global (Spentera Group)",
                    position: "Lead Team – Cybersecurity Blueteam L2",
                    period: "Aug 2020 – Feb 2023",
                    responsibilities: [
                        "Lead the development of planning, implementation, management, monitoring, and improvement of security measures",
                        "Ensuring that the organization's data and infrastructure are protected by enabling the appropriate security controls",
                        "Perform security analyst at Layer 2 and Daily administrative tasks",
                        "Installation and tuning of opensource SIEM (ELK, WAZUH, SecurityOnion)",
                        "Threat hunting before and after the incident",
                        "Create internal procedures for ISO 270001 for Bank",
                        "Vulnerability Assessment and Penetration Testing for bank",
                        "Hardening Infrastructure and implementation for company and bank"
                    ]
                },
                {
                    company: "PT Spentera (Spentera Group)",
                    position: "Junior Penetration Tester",
                    period: "May 2020 - Jul 2020",
                    responsibilities: [
                        "Network Pentest for Bank"
                    ]
                }
            ],
            certifications: [
                "Certified Network Defender (EC-Council)",
                "Certified SOC Analyst (EC-Council)",
                "Cybersecurity Essentials (Cisco Networking Academy)",
                "Google IT Support Specialization (Coursera)",
                "IBM Security Analyt Fundamentals (IBM)",
                "Certified Network Security Specialist (ICSI)",
                "BINTALFISDIS (TNI)"
            ],
            achievements: [
                {
                    name: "BlueteamLabs",
                    url: "https://blueteamlabs.online/home/user/f99a5a5f8df8c71bc5dd24"
                },
                {
                    name: "HackTheBox",
                    url: "https://app.hackthebox.com/profile/284315"
                },
                {
                    name: "Cybersecurity Monitoring Event G20 Bali with BSSN",
                    url: "#"
                },
                {
                    name: "Bug Bounty Hackerone",
                    url: "#"
                }
            ],
            education: [
                {
                    institution: "Politeknik Negeri Medan",
                    degree: "Computer Engineering",
                    period: "2012 - 2015",
                    gpa: "GPA 3.02"
                }
            ]
        };
        
        let typingIndex = 0;
        let currentText = "";
        const typingElement = document.getElementById('typing-content');
        
        function typeWriter() {
            const fullText = `
> Initializing security profile system...
> Loading data from secure database...
> Verifying credentials...
> 
> Name: ${profileData.name}
> Title: ${profileData.title}
> Location: ${profileData.location}
> Contact: ${profileData.contact}
> LinkedIn: ${profileData.linkedin}
> 
> ${profileData.summary}
> 
> System ready. All security modules loaded successfully.
            `;
            
            if (typingIndex < fullText.length) {
                currentText += fullText.charAt(typingIndex);
                typingElement.innerHTML = currentText.replace(/\n/g, '<br>');
                typingIndex++;
                setTimeout(typeWriter, 30);
            } else {
                typingElement.classList.remove('typing-cursor');
                loadSkills();
                loadExperience();
                loadCertifications();
                loadAchievements();
                loadEducation();
            }
        }
        
        function loadSkills() {
            const skillsContainer = document.getElementById('skills-container');
            profileData.skills.forEach((skill, index) => {
                setTimeout(() => {
                    const badge = document.createElement('span');
                    badge.className = 'skill-badge pulse';
                    badge.innerHTML = `<i class="fas fa-shield-virus mr-1"></i>${skill}`;
                    skillsContainer.appendChild(badge);
                }, index * 200);
            });
        }
        
        function loadExperience() {
            const experienceContainer = document.getElementById('experience-container');
            profileData.experiences.forEach((exp, expIndex) => {
                setTimeout(() => {
                    const expDiv = document.createElement('div');
                    expDiv.className = 'experience-item';
                    expDiv.innerHTML = `
                        <h4 class="text-green font-bold text-lg">${exp.position}</h4>
                        <p class="text-cyan">${exp.company}</p>
                        <p class="text-gray-400 text-sm">${exp.period}</p>
                        <ul class="mt-2 text-gray-300 text-sm">
                            ${exp.responsibilities.slice(0, 3).map(resp => `<li class="mb-1">• ${resp}</li>`).join('')}
                            ${exp.responsibilities.length > 3 ? `<li class="text-gray-500">... and ${exp.responsibilities.length - 3} more</li>` : ''}
                        </ul>
                    `;
                    experienceContainer.appendChild(expDiv);
                }, expIndex * 500);
            });
        }
        
        function loadCertifications() {
            const certificationsContainer = document.getElementById('certifications-container');
            profileData.certifications.forEach((cert, index) => {
                setTimeout(() => {
                    const badge = document.createElement('span');
                    badge.className = 'cert-badge pulse';
                    badge.innerHTML = `<i class="fas fa-certificate mr-1"></i>${cert}`;
                    certificationsContainer.appendChild(badge);
                }, index * 150);
            });
        }
        
        function loadAchievements() {
            const achievementsContainer = document.getElementById('achievements-container');
            profileData.achievements.forEach((achievement, index) => {
                setTimeout(() => {
                    const link = document.createElement('a');
                    link.href = achievement.url;
                    link.className = 'achievement-link';
                    link.target = '_blank';
                    link.innerHTML = `<i class="fas fa-external-link-alt mr-1"></i>${achievement.name}`;
                    achievementsContainer.appendChild(link);
                }, index * 200);
            });
        }
        
        function loadEducation() {
            const educationContainer = document.getElementById('education-container');
            profileData.education.forEach((edu, index) => {
                setTimeout(() => {
                    const eduDiv = document.createElement('div');
                    eduDiv.className = 'mb-3';
                    eduDiv.innerHTML = `
                        <h4 class="text-green font-bold">${edu.institution}</h4>
                        <p class="text-cyan">${edu.degree}</p>
                        <p class="text-gray-400 text-sm">${edu.period} | ${edu.gpa}</p>
                    `;
                    educationContainer.appendChild(eduDiv);
                }, index * 300);
            });
        }
        
        // Start typing animation
        setTimeout(typeWriter, 1000);
        
        // Resize canvas on window resize
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
